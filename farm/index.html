<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#4f8a3a">
  <title>Jarvis Farm</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%9C%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/farm.css">
</head>
<body>
  <canvas id="game" aria-label="Farm map"></canvas>

  <header id="hud">
    <div class="hud-group">
      <span id="hudMoney" class="chip">💰 $0</span>
      <span id="hudDay" class="chip">Day 1 · 06:00</span>
    </div>
    <div class="hud-group">
      <span class="chip energy" title="Energy"><span>⚡</span><span class="bar"><span id="hudEnergy"></span></span><span id="hudEnergyText">100</span></span>
      <span id="hudLevel" class="chip">⭐ Lv 1</span>
      <button id="btnSpeed" class="hud-btn" title="Game speed">1×</button>
      <button id="btnPause" class="hud-btn" title="Pause">⏸️</button>
    </div>
  </header>

  <nav id="rail" aria-label="Menus">
    <button data-panel="inventory" title="Inventory"><span>🎒</span><small>Items</small></button>
    <button data-panel="shop" title="Shop"><span>🛒</span><small>Shop</small></button>
    <button data-panel="market" title="Market"><span>⚖️</span><small>Market</small></button>
    <button data-panel="build" title="Build mode (B)"><span>🏗️</span><small>Build</small></button>
    <button data-panel="home" title="Home"><span>🏠</span><small>Home</small></button>
    <button data-panel="menu" title="Menu"><span>☰</span><small>Menu</small></button>
  </nav>

  <div id="hotbar" role="toolbar" aria-label="Tools"></div>
  <div id="buildbar" hidden></div>

  <div id="panelBackdrop" hidden>
    <section id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
      <header class="panel-head">
        <h2 id="panelTitle"></h2>
        <button id="panelClose" aria-label="Close">✕</button>
      </header>
      <div id="panelTabs" hidden></div>
      <div id="panelBody"></div>
    </section>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <div id="tooltip" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
